[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eth-research"
version = "0.7.0"
description = "Research-only toolkit for developing and evaluating Ethereum trading algorithms on historical data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eth_research"]

[tool.uv]
# Pin the isolated-build toolchain too, so builds are as frozen as the
# runtime/dev graph locked in uv.lock.
build-constraint-dependencies = ["hatchling==1.31.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
    "slow: re-runs the full 75-cell fractional grid (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PT",  # flake8-pytest-style
    "NPY", # numpy rules
    "PD",  # pandas-vet
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["eth_research"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "examples"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
