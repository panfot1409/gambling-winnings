[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "eth-research"
version = "1.1.0"
description = "Offline, reproducible toolkit for research and simulation of Ethereum trading strategies on historical market data — no live trading."
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "ethereum",
    "backtesting",
    "simulation",
    "quantitative-research",
    "reproducible-research",
    "offline",
    "walk-forward",
    "portfolio",
]
authors = [{ name = "The eth-research maintainers" }]
maintainers = [{ name = "The eth-research maintainers" }]
# No license classifier is declared: the repository ships no LICENSE and choosing one is an
# external human decision (see docs/V1_LICENSE_DECISION.md). "Private :: Do Not Upload" is a
# deliberate belt-and-suspenders guard so the unlicensed package cannot be pushed to public PyPI
# by accident; the maintainer removes it when the license + trusted-publisher gates are cleared.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.urls]
Homepage = "https://github.com/panfot1409/gambling-winnings"
Repository = "https://github.com/panfot1409/gambling-winnings"
Documentation = "https://github.com/panfot1409/gambling-winnings/tree/main/docs"
Changelog = "https://github.com/panfot1409/gambling-winnings/blob/main/CHANGELOG.md"
Issues = "https://github.com/panfot1409/gambling-winnings/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
eth-research = "eth_research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eth_research"]
# Belt-and-suspenders: never let a byte-compiled cache or a stray dotfile ride along.
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.sdist]
# Private-data-safe distribution. ``only-include`` is a strict, path-anchored allowlist:
# the sdist ships ONLY the runtime package source (including py.typed), the build metadata,
# and the root README — the exact inputs needed to rebuild the wheel. Everything else is
# excluded by omission: research/** (raw market data and the sealed governance ledgers),
# .github/**, tests/**, tools/**, docs/**, uv.lock, and every dotfile or cache. (A bare
# ``include`` glob would match README.md at any depth and leak the research/ READMEs, so
# the anchored ``only-include`` is used instead.) tools/scan_distribution.py enforces this
# allowlist on the built artifacts.
only-include = [
    "src/eth_research",
    "pyproject.toml",
    "README.md",
]
# hatchling always ships a benign .gitignore in the sdist regardless of exclude; the
# distribution scanner allowlists exactly that one support file and nothing else.
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.uv]
# Pin the isolated-build toolchain too, so builds are as frozen as the
# runtime/dev graph locked in uv.lock.
build-constraint-dependencies = ["hatchling==1.31.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
    "slow: re-runs the full 75-cell fractional grid (deselect with -m 'not slow')",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PT",  # flake8-pytest-style
    "NPY", # numpy rules
    "PD",  # pandas-vet
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["eth_research"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "examples"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
