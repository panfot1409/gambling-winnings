name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Compatibility coverage: the package must import, type-check, and pass its
    # suite on every supported interpreter. These jobs may parse the runtime
    # contract but never claim to be the authoritative benchmark runtime.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # full history: the shared gate verifies the protocol-registration commit
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment (runtime + dev extras)
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format check
        run: uv run --no-sync ruff format --check .
      - name: Type check (strict, including examples)
        run: uv run --no-sync mypy src tests examples
      - name: Compatibility runtime-contract parse
        run: uv run --no-sync python -m eth_research.environment --repo-root . --compat
      - name: Tests
        run: uv run --no-sync pytest
      - name: M3D honest governance state (data-only graph verify + status)
        run: |
          set -euo pipefail
          uv run --no-sync python -m eth_research.m3d.replay --repo-root . --deep
          uv run --no-sync python -m eth_research.m3d.status --repo-root . > "$RUNNER_TEMP/m3d_status.json"
          jq . "$RUNNER_TEMP/m3d_status.json"
          test "$(jq -r '.maturity_state' "$RUNNER_TEMP/m3d_status.json")" = "immature"
          test "$(jq -r '.evaluation_authorized' "$RUNNER_TEMP/m3d_status.json")" = "false"
          test "$(jq -r '.strategy_evaluation_performed' "$RUNNER_TEMP/m3d_status.json")" = "false"
          test "$(jq -r '.candidate_declared' "$RUNNER_TEMP/m3d_status.json")" = "false"
          test "$(jq -r '.performance_metrics_computed' "$RUNNER_TEMP/m3d_status.json")" = "false"
          test "$(jq -r '.promotion_decision_exists' "$RUNNER_TEMP/m3d_status.json")" = "false"
          test "$(jq -r '.evaluation_ledger_byte_count' "$RUNNER_TEMP/m3d_status.json")" = "0"
      - name: M3E review-only honest state (byte-exact replay + status)
        run: |
          set -euo pipefail
          uv run --no-sync python -m eth_research.m3e.replay --repo-root . --deep
          uv run --no-sync python -m eth_research.m3e.status --repo-root . > "$RUNNER_TEMP/m3e_status.json"
          jq . "$RUNNER_TEMP/m3e_status.json"
          test "$(jq -r '.accepted_base.maturity_state' "$RUNNER_TEMP/m3e_status.json")" = "immature"
          test "$(jq -r '.accepted_base.evaluation_authorized' "$RUNNER_TEMP/m3e_status.json")" = "false"
          test "$(jq -r '.workflow_posture.active' "$RUNNER_TEMP/m3e_status.json")" = "false"
          test "$(jq -r '.registry.proposals_recorded' "$RUNNER_TEMP/m3e_status.json")" = "0"
          test "$(jq -r '.governance_flags.strategy_evaluated' "$RUNNER_TEMP/m3e_status.json")" = "false"
          test "$(jq -r '.governance_flags.money_moved' "$RUNNER_TEMP/m3e_status.json")" = "false"
          test "$(jq -r '.ledgers.prospective_evaluation_byte_count' "$RUNNER_TEMP/m3e_status.json")" = "0"

  authoritative-runtime:
    # The one runtime the authorized benchmark may run on: CPython 3.12.3 with
    # the locked numerical stack. Installs that exact interpreter and attests
    # the frozen runtime contract. The frozen M2B contract pins package 0.3.0;
    # this branch runs the later 0.4.0 package over the same frozen dossier, so
    # the honest state is: the numerical runtime identity is verified, while the
    # strict production gate correctly refuses (the sealed one-time test may run
    # only on its exact 0.3.0 frozen runtime).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # full history: the shared gate verifies the protocol-registration commit
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment on the authoritative runtime
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Attest the numerical runtime identity against the frozen contract
        run: uv run --no-sync --python 3.12.3 python -m eth_research.environment --repo-root .
      - name: The authorized one-time test must refuse under the superseded package version
        run: |
          set -euo pipefail
          if uv run --no-sync --python 3.12.3 python -m eth_research.environment \
            --repo-root . --production; then
            echo "--production unexpectedly exited zero under a superseded package version"
            exit 1
          else
            echo "correctly refused: the authorized benchmark runs only on the frozen runtime"
          fi
      - name: Tests on the authoritative runtime
        run: uv run --no-sync --python 3.12.3 pytest
      - name: The standing end-to-end lifecycle must execute here (never skip)
        # The successful production lifecycle (register -> started -> publish ->
        # readback -> completed -> replay -> single-use refusal) must run on the
        # authoritative runtime even after run-003 is completed. Fail if pytest
        # reports it skipped, deselected, or xfailed rather than passed.
        run: |
          set -euo pipefail
          node="tests/test_m3a_orchestrator_e2e.py::TestSuccessfulEndToEnd::test_full_production_lifecycle"
          out=$(uv run --no-sync --python 3.12.3 pytest "$node" -rsxX 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qE "[0-9]+ passed" || { echo "FAIL: E2E lifecycle did not pass"; exit 1; }
          if echo "$out" | grep -qiE "skipped|deselected|xfailed|no tests ran"; then
            echo "FAIL: the standing E2E lifecycle was skipped/deselected on the authoritative runtime"
            exit 1
          fi

  readiness:
    # The exact honest state of the one-time test, asserted on every fresh
    # clone: integrity-ready and holdout-fresh, the candidate scientifically
    # REJECTED, and therefore NOT authorized-test-ready — with a byte-empty
    # ledger. The rejection is a research finding, not an infrastructure
    # failure: the informational CLI exits zero for it, and the
    # --require-authorized-test-ready flag must exit nonzero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # full history: the shared gate verifies the protocol-registration commit
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Sync locked environment on the authoritative runtime
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Reconstruct the canonical dataset offline from committed raw
        run: |
          uv run --no-sync --python 3.12.3 python -m eth_research.replay_m2b \
            --repo-root . --work-dir "$RUNNER_TEMP/replay" --check
      - name: Assert the exact honest readiness state
        run: |
          set -euo pipefail
          uv run --no-sync --python 3.12.3 python -m eth_research.test_readiness \
            --repo-root . \
            --manifest "$RUNNER_TEMP/replay/datasets/coinbase-exchange-eth-usd-86400s.manifest.json" \
            > "$RUNNER_TEMP/readiness.json"
          jq . "$RUNNER_TEMP/readiness.json"
          test "$(jq -r '.integrity_ready' "$RUNNER_TEMP/readiness.json")" = "true"
          test "$(jq -r '.integrity_failure' "$RUNNER_TEMP/readiness.json")" = "null"
          test "$(jq -r '.dossier_verified' "$RUNNER_TEMP/readiness.json")" = "true"
          test "$(jq -r '.holdout_fresh' "$RUNNER_TEMP/readiness.json")" = "true"
          test "$(jq -r '.promotion_decision' "$RUNNER_TEMP/readiness.json")" = "rejected_for_test_promotion"
          test "$(jq -r '.promotion_eligible' "$RUNNER_TEMP/readiness.json")" = "false"
          test "$(jq -r '.authorized_test_ready' "$RUNNER_TEMP/readiness.json")" = "false"
          test "$(jq -r '.output_collision' "$RUNNER_TEMP/readiness.json")" = "false"
          test "$(jq -r '.train_validation_reproducible' "$RUNNER_TEMP/readiness.json")" = "true"
          test "$(jq -r '.ledger_byte_count' "$RUNNER_TEMP/readiness.json")" = "0"
          test "$(jq -r '.ledger_event_count' "$RUNNER_TEMP/readiness.json")" = "0"
          test "$(jq -r '.ledger_sha256' "$RUNNER_TEMP/readiness.json")" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          test "$(jq -r '.test_row_count' "$RUNNER_TEMP/readiness.json")" = "741"
          test "$(jq -r '.test_first_open_time' "$RUNNER_TEMP/readiness.json")" = "2024-07-01T00:00:00+00:00"
      - name: The rejected candidate must NOT be authorized-test-ready
        run: |
          set -euo pipefail
          if uv run --no-sync --python 3.12.3 python -m eth_research.test_readiness \
            --repo-root . \
            --manifest "$RUNNER_TEMP/replay/datasets/coinbase-exchange-eth-usd-86400s.manifest.json" \
            --require-authorized-test-ready > /dev/null; then
            echo "--require-authorized-test-ready unexpectedly exited zero"; exit 1
          else
            echo "correctly not authorized-test-ready (scientific rejection)"
          fi
