name: V2A Replay

# Offline reproducibility for the V2A commercial-evidence stack: the research core, the signal-only
# shadow-operations platform, and the buyer-evaluation boundary. The v2 test suites plus the offline
# replay verifier re-derive every fixed design invariant (protocol / constitution / contract /
# claims / scorecard / factsheet fingerprints), assemble the redacted diligence bundle past the
# fail-closed redaction gate, and — once the governed run is published — re-verify the results,
# manifest, and the append-only one-shot registry against the committed bytes. Everything is offline
# and signal-only: no networking, no orders, no sealed partition. The three sealed access ledgers
# stay byte-empty throughout.

on:
  push:
    branches: ["**"]
    paths:
      - "src/eth_research/v2/**"
      - "src/eth_research/shadow/**"
      - "src/eth_research/buyer/**"
      - "tests/test_v2_*.py"
      - "tests/test_shadow_platform.py"
      - "tests/test_buyer_boundary.py"
      - "tests/test_v2a_replay.py"
      - "research/v2a/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/v2a-replay.yml"
  pull_request:

permissions:
  contents: read

env:
  GATE_LEDGER: research/m3a/development_gate_access.jsonl
  HOLDOUT_LEDGER: research/m2b/test_evaluations.jsonl
  PROSPECTIVE_LEDGER: research/m3d/prospective_evaluations.jsonl
  EMPTY_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

jobs:
  v2a-replay:
    # Reproduce under the exact authoritative runtime (CPython 3.12.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: The V2 / shadow / buyer test suites must run (cannot silently skip)
        run: |
          uv run --no-sync --python 3.12.3 python -m pytest -q -p no:cacheprovider \
            tests/test_v2_core.py tests/test_v2_candidates.py tests/test_v2_evaluation.py \
            tests/test_v2_results_registry.py tests/test_v2_orchestrator.py \
            tests/test_shadow_platform.py tests/test_buyer_boundary.py tests/test_v2a_replay.py
      - name: Offline V2A replay verifier (design invariants + any published run)
        run: uv run --no-sync --python 3.12.3 python -m eth_research.v2.replay --check --repo-root .
      - name: All three sealed ledgers are byte-empty throughout
        run: |
          for ledger in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            if [ -s "$ledger" ]; then
              echo "sealed ledger $ledger is not byte-empty" >&2
              exit 1
            fi
            got=$(sha256sum "$ledger" | cut -d' ' -f1)
            if [ "$got" != "$EMPTY_SHA" ]; then
              echo "sealed ledger $ledger changed (sha $got)" >&2
              exit 1
            fi
          done
          echo "all three sealed ledgers are byte-empty"
