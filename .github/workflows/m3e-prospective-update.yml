# Milestone 3E — review-only prospective-update probe (READY, NOT ACTIVE).
#
# This standing workflow is a strictly READ-ONLY "update-due probe". On a trusted
# schedule or manual dispatch it verifies the accepted base and mechanically computes
# the completed-day cutoff, then reports whether a new completed day is due. It does
# NOT fetch, does NOT assemble, does NOT upload any artifact, and does NOT push or open
# a pull request. Consistent with this repository's accepted security posture, no
# workflow at HEAD writes repository contents, contacts an exchange host, uploads an
# artifact, or holds a secret.
#
# The full acquisition→two-runner-attestation→assemble→draft-PR automation is
# implemented as OFFLINE machinery (eth_research.m3e: acquire_runner, comparison,
# transition, assembly, publisher) and proven end-to-end by the disposable-repo
# rehearsal (tests/test_m3e_publisher_e2e.py). Activating it as a live workflow — which
# would fetch public candles and open a DRAFT review PR — is a separate, human-reviewed
# step documented in docs/M3E_PROSPECTIVE_PROTOCOL.md; it is intentionally not wired to
# run unattended here.
#
# On this stacked feature branch a `schedule:` trigger is inert (only default-branch
# schedules fire) and a `workflow_dispatch:` is not dispatchable, so the probe is ready
# but not active.

name: M3E Prospective Update Probe

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3e-prospective-update
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'panfot1409/gambling-winnings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Verify the accepted base and report whether an update is due (offline, read-only)
        run: |
          set -euo pipefail
          AS_OF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Writes the plan to a runner-temp path (never the repo, never an artifact)
          # only when a new completed day is due; prints DUE or NO-OP either way. This
          # probe never fetches, assembles, uploads, pushes, or opens a PR.
          uv run --no-sync python -m eth_research.m3e.acquire_runner plan \
            --repo-root . --as-of "$AS_OF" --out "$RUNNER_TEMP/update_plan.json"
      - name: The probe mutated no tracked file
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
