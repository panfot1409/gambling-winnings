# Milestone 3E — review-only prospective-update automation (READY, NOT ACTIVE).
#
# This standing workflow proposes append-only growth of the accepted prospective
# ETH-USD daily cohort. It is deliberately *read-only* and never pushes, never opens
# a pull request, and never merges: it verifies the accepted base, mechanically
# computes the completed-day cutoff, and — only if a new completed day is due —
# fetches the new window on TWO ISOLATED RUNNER JOBS, validates each offline,
# requires byte-identical canonical content, assembles the append-only proposal
# offline, runs the 35-check proposal verifier, and UPLOADS the verified proposal as
# a workflow artifact for human review. Turning that artifact into a DRAFT pull
# request is a separate, human-gated step (see docs/M3E_PROTOCOL and the preserved
# activation template under research/m3e/).
#
# Trust + safety invariants (also enforced by tests/test_m3e_workflow_security.py):
#   * permissions declare read-only repository contents — no job can write;
#   * the exchange endpoint is read from the committed plan (no literal host here);
#   * no repository secret, no PAT, no force-push, no PR-target event, no auto-merge;
#   * the Python runner opens no socket — the network boundary is the curl step.
#
# On this stacked feature branch the `schedule:` trigger is inert (only default-branch
# schedules fire), so the facility is ready but not active.

name: M3E Prospective Update

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:
  # TEMPORARY audit-mode bootstrap (retired in a later commit): because a
  # workflow_dispatch is not dispatchable from a non-default branch and a schedule
  # only fires on the default branch, a committed push sentinel is the only way to
  # exercise this standing workflow live on the stacked feature branch. It proves the
  # facility runs and — at today's date — correctly detects a no-op and proposes
  # nothing. Removed, together with the sentinel, once the live evidence is recorded.
  push:
    branches: ["claude/m3e-review-only-prospective-updates"]
    paths:
      - "research/m3e/audit.trigger"

permissions:
  contents: read

concurrency:
  group: m3e-prospective-update
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'panfot1409/gambling-winnings'
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.plan.outputs.due }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Verify the accepted base and compute the completed-day cutoff (offline)
        id: plan
        run: |
          set -euo pipefail
          AS_OF="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p _proposal
          if uv run --no-sync python -m eth_research.m3e.acquire_runner plan \
              --repo-root . --as-of "$AS_OF" --out _proposal/update_plan.json | tee _plan.log \
              && test -f _proposal/update_plan.json; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^NO-OP' _plan.log; then echo "due=false" >> "$GITHUB_OUTPUT"; fi
      - name: Upload the update plan (only when a new completed day is due)
        if: steps.plan.outputs.due == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: m3e-update-plan
          path: _proposal/update_plan.json
          if-no-files-found: error

  runner:
    needs: plan
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b] # two isolated runner jobs on two isolated runners
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Download the committed update plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: m3e-update-plan
          path: staging
      - name: Emit the offline-computed curl request plan
        run: |
          set -euo pipefail
          uv run --no-sync python -m eth_research.m3e.acquire_runner emit-plan \
            --plan staging/update_plan.json --out staging/_curl_plan.json
      - name: Fetch each window with hardened curl (TLS, no redirect, size cap)
        run: |
          set -euo pipefail
          PLAN=staging/_curl_plan.json
          UA="$(jq -r .user_agent "$PLAN")"
          ENDPOINT="$(jq -r .endpoint "$PLAN")"
          GRAN="$(jq -r .granularity_seconds "$PLAN")"
          CAP="$(jq -r .max_body_bytes "$PLAN")"
          : > staging/_responses.jsonl
          COUNT="$(jq '.windows | length' "$PLAN")"
          for i in $(seq 0 $((COUNT - 1))); do
            ORD="$(jq -r ".windows[$i].ordinal" "$PLAN")"
            START="$(jq -r ".windows[$i].start_param" "$PLAN")"
            END="$(jq -r ".windows[$i].end_param" "$PLAN")"
            FN="$(jq -r ".windows[$i].filename" "$PLAN")"
            URL="${ENDPOINT}?start=${START}&end=${END}&granularity=${GRAN}"
            META="$(curl -sS --proto '=https' --tlsv1.2 --max-redirs 0 --fail \
              --max-filesize "$CAP" -H "User-Agent: ${UA}" \
              -w '%{http_code}\t%{content_type}' \
              -o "staging/${FN}" "$URL")"
            CODE="$(printf '%s' "$META" | cut -f1)"
            CT="$(printf '%s' "$META" | cut -f2)"
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '{"content_type":"%s","filename":"%s","http_code":%s,"ordinal":%s,"retrieved_at":"%s"}\n' \
              "$CT" "$FN" "$CODE" "$ORD" "$NOW" >> staging/_responses.jsonl
          done
      - name: Validate every response offline and write the receipt
        run: |
          set -euo pipefail
          uv run --no-sync python -m eth_research.m3e.acquire_runner verify \
            --plan staging/update_plan.json --staging staging \
            --receipt-out staging/acquisition_receipt.json \
            --attempt-id "coinbase-eth-usd-prospective-update-runner-${{ matrix.runner }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --client-identity "curl (hardened workflow boundary)" \
            --runner-identity "runner-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -f staging/_curl_plan.json staging/_responses.jsonl
      - name: Upload this runner's artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: m3e-runner-${{ matrix.runner }}
          path: staging
          if-no-files-found: error

  assemble:
    needs: [plan, runner]
    if: needs.plan.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Download runner A artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: m3e-runner-a
          path: _proposal/runner_a
      - name: Download runner B artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: m3e-runner-b
          path: _proposal/runner_b
      - name: Assemble + self-verify the append-only proposal (offline, no push, no PR)
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          from eth_research.m3e.assembly import assemble_update_proposal
          from eth_research.m3e.publisher import build_draft_pr_descriptor
          from eth_research.m3e.verify_m3e_program import verify_update_proposal
          assembled, digests = assemble_update_proposal(".", "_proposal")
          checks = verify_update_proposal(".", "_proposal")
          descriptor = build_draft_pr_descriptor(assembled, proposal_relpath="_proposal")
          assert descriptor["draft"] is True and descriptor["auto_merge"] is False
          print(f"assembled proposal onto {descriptor['head_branch']} ({len(checks)} checks)")
          PY
      - name: Replay mutated no tracked file (no repository write)
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain | grep -v '^?? _proposal/' || true)"
      - name: Upload the verified proposal for HUMAN REVIEW (no push, no PR)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: m3e-update-proposal
          path: _proposal
          if-no-files-found: error
