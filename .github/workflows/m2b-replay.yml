name: M2B Replay

# Fresh-clone reproducibility: from the committed raw Coinbase bytes alone,
# rebuild every git-ignored derived artifact and verify it against the frozen
# committed metadata, on the authoritative runtime and on the compatibility
# matrix. No networking, and the test-access ledger must stay byte-empty.

on:
  push:
    branches: ["**"]
    paths:
      - "research/m2b/**"
      - "src/eth_research/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/m2b-replay.yml"
  pull_request:

permissions:
  contents: read

jobs:
  authoritative-replay:
    # Rebuild and verify under the exact authoritative runtime (CPython 3.12.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install uv 0.8.17 (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Ledger is byte-empty before
        run: test -f research/m2b/test_evaluations.jsonl && test ! -s research/m2b/test_evaluations.jsonl
      - name: Verify the authoritative runtime contract
        run: uv run --no-sync --python 3.12.3 python -m eth_research.environment --repo-root .
      - name: Replay raw to derived and verify against the committed metadata
        run: uv run --no-sync --python 3.12.3 python -m eth_research.replay_m2b --repo-root . --work-dir data/m2b --check
      - name: Regenerate the train/validation dossier and compare
        run: uv run --no-sync --python 3.12.3 python -m eth_research.m2b_report --repo-root . --check
      - name: Ledger is byte-empty after
        run: test -f research/m2b/test_evaluations.jsonl && test ! -s research/m2b/test_evaluations.jsonl

  compat-replay:
    # The derived data and train/validation outputs must reproduce identically
    # on every supported interpreter (the contract is the content fingerprint).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install uv 0.8.17 (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Compatibility runtime-contract parse
        run: uv run --no-sync python -m eth_research.environment --repo-root . --compat
      - name: Replay raw to derived and verify against the committed metadata
        run: uv run --no-sync python -m eth_research.replay_m2b --repo-root . --work-dir data/m2b --check
      - name: Regenerate the train/validation dossier and compare
        run: uv run --no-sync python -m eth_research.m2b_report --repo-root . --check
      - name: Ledger is byte-empty after
        run: test -f research/m2b/test_evaluations.jsonl && test ! -s research/m2b/test_evaluations.jsonl
