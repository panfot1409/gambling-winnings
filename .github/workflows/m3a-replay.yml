name: M3A Replay

# Fresh-clone reproducibility for the Milestone 3A development laboratory:
# from the committed raw Coinbase bytes alone, reconstruct the dataset offline
# and reproduce the research-train walk-forward results JSON and report,
# byte-for-byte, on the authoritative runtime and on the compatibility matrix.
# No networking. Both access ledgers — the development gate and the final
# holdout — must stay byte-empty, and the registration commit label must equal
# the walk-forward protocol freeze commit in git history.

on:
  push:
    branches: ["**"]
    paths:
      - "research/m3a/**"
      - "research/m2b/raw/**"
      - "research/m2b/acquisition_request_plan.json"
      - "src/eth_research/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/m3a-replay.yml"
  pull_request:

permissions:
  contents: read

env:
  GATE_LEDGER: research/m3a/development_gate_access.jsonl
  HOLDOUT_LEDGER: research/m2b/test_evaluations.jsonl
  EMPTY_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

jobs:
  authoritative-replay:
    # Reproduce under the exact authoritative numerical runtime (CPython 3.12.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # develop_m3a --check binds the registration commit to git history
      - name: Install uv 0.8.17 (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Both access ledgers are byte-empty before
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
      - name: Attest the numerical runtime identity against the frozen contract
        run: uv run --no-sync --python 3.12.3 python -m eth_research.environment --repo-root .
      - name: Reconstruct and reproduce the development results and report
        run: uv run --no-sync --python 3.12.3 python -m eth_research.develop_m3a --repo-root . --check
      - name: The committed registry terminal event binds the published bytes
        run: uv run --no-sync --python 3.12.3 python .github/scripts/verify_m3a_registry.py
      - name: Both access ledgers are byte-empty after
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"

  compat-replay:
    # The results and report must reproduce identically on every supported
    # interpreter (pure computed JSON; the numerical stack is version-locked).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # develop_m3a --check binds the registration commit to git history
      - name: Install uv 0.8.17 (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Compatibility runtime-contract parse
        run: uv run --no-sync python -m eth_research.environment --repo-root . --compat
      - name: Reconstruct and reproduce the development results and report
        run: uv run --no-sync python -m eth_research.develop_m3a --repo-root . --check
      - name: The committed registry terminal event binds the published bytes
        run: uv run --no-sync python .github/scripts/verify_m3a_registry.py
      - name: Both access ledgers are byte-empty after
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
