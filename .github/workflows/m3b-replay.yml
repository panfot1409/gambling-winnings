name: M3B Replay

# Fresh-clone reproducibility for the Milestone 3B fractional execution-risk
# laboratory. Dual-state: green both before the one preregistered run (pristine
# — no run-001 event, no published artifacts) and after it (completed — the
# research-train partition is reconstructed offline from the committed raw
# Coinbase bytes, the 75-cell experiment is re-run, and the results JSON and
# report Markdown reproduce byte-for-byte). No networking. Both sealed access
# ledgers — the development gate and the final holdout — must stay byte-empty.

on:
  push:
    branches: ["**"]
    paths:
      - "research/m3b/**"
      - "research/m3a/development_partition.json"
      - "research/m2b/**"
      - "src/eth_research/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/m3b-replay.yml"
  pull_request:

permissions:
  contents: read

env:
  GATE_LEDGER: research/m3a/development_gate_access.jsonl
  HOLDOUT_LEDGER: research/m2b/test_evaluations.jsonl
  EMPTY_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

jobs:
  authoritative-replay:
    # Reproduce under the exact authoritative numerical runtime (CPython 3.12.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Both sealed ledgers are byte-empty before
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
      - name: Dual-state replay (reproduce the fractional run byte-for-byte if present)
        run: uv run --no-sync --python 3.12.3 python -m eth_research.fractional.replay --repo-root . --check
      - name: Both sealed ledgers are byte-empty after
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"

  compat-replay:
    # The results and report must reproduce identically on every supported
    # interpreter (pure computed JSON; the numerical stack is version-locked).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: Both sealed ledgers are byte-empty before
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
      - name: Dual-state replay (reproduce the fractional run byte-for-byte if present)
        run: uv run --no-sync python -m eth_research.fractional.replay --repo-root . --check
      - name: Both sealed ledgers are byte-empty after
        run: |
          set -euo pipefail
          test "$(sha256sum "$GATE_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
          test "$(sha256sum "$HOLDOUT_LEDGER" | cut -d' ' -f1)" = "$EMPTY_SHA"
