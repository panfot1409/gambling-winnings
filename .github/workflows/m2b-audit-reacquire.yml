name: M2B Audit Reacquire

# TEMPORARY one-shot workflow: independent integrity-only REACQUISITION
# (attempt coinbase-eth-usd-audit-002) of the frozen public Coinbase
# Exchange ETH-USD daily candles, fulfilling the UNCHANGED canonical
# committed request plan. Public unauthenticated GET to one fixed endpoint
# only — no secret, key, account, wallet, order, or private endpoint. It
# never touches the canonical attempt or any frozen artifact: it only ADDS
# a new audit attempt directory (raw bodies + strict receipt) for offline
# comparison, and is removed again immediately after its single successful
# run (docs/M2B_FINAL_CLOSURE.md, section "Reacquisition design").
#
# Hardening (asserted by tests/test_workflow_security.py while this file
# exists): exact repo+branch guards; the only trigger is a push touching
# the one committed trigger file; concurrency group; contents:write on
# this single job only; SHA-pinned actions; no installer is ever piped
# into a shell — uv arrives as a hash-pinned PyPI wheel verified with
# sha256sum before execution; the
# checkout must equal the triggering SHA; a pre-existing audit attempt
# directory refuses the run; staging in RUNNER_TEMP with strict offline
# validation before publication; per-body and aggregate byte caps; an
# exact staged-path allowlist before the bot commit; a pre-push assertion
# that the remote branch still equals the triggering SHA; fast-forward
# push only; response bodies are never logged.

on:
  push:
    branches: ["claude/m2b-real-data-benchmarks"]
    paths:
      - "research/m2b/audit_acquire.trigger"

permissions:
  contents: read

concurrency:
  group: m2b-audit-reacquire
  cancel-in-progress: false

env:
  AUDIT_ATTEMPT_ID: coinbase-eth-usd-audit-002
  PLAN_PATH: research/m2b/acquisition_request_plan.json
  UV_WHEEL_URL: https://files.pythonhosted.org/packages/8f/35/cb47d2d07a383c07b0e5043c6fe5555f0fd79683c6d7f9760222987c8be9/uv-0.8.17-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
  UV_WHEEL_SHA256: b6d30d02fb65193309fc12a20f9e1a9fab67f469d3e487a254ca1145fd06788f

jobs:
  reacquire:
    # Never on a fork, never off this repo/branch.
    if: >-
      github.repository == 'panfot1409/gambling-winnings' &&
      github.ref == 'refs/heads/claude/m2b-real-data-benchmarks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: claude/m2b-real-data-benchmarks
          persist-credentials: true

      - name: Assert the exact revision, trigger, and a fresh attempt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -f research/m2b/audit_acquire.trigger
          test -f "$PLAN_PATH"
          # The committed trigger must request exactly this one-shot audit.
          test "$(jq -r '.attempt_id' research/m2b/audit_acquire.trigger)" = "$AUDIT_ATTEMPT_ID"
          test "$(jq -r '.plan_path' research/m2b/audit_acquire.trigger)" = "$PLAN_PATH"
          # Refuse to run against a pre-existing audit attempt directory.
          test ! -e "research/m2b/raw/coinbase/$AUDIT_ATTEMPT_ID"

      - name: Install uv 0.8.17 (hash-verified wheel, no piped installer)
        run: |
          set -euo pipefail
          curl --silent --show-error --location \
            --connect-timeout 20 --max-time 120 --retry 0 \
            --output "$RUNNER_TEMP/uv.whl" "$UV_WHEEL_URL"
          echo "$UV_WHEEL_SHA256  $RUNNER_TEMP/uv.whl" | sha256sum --check --strict -
          unzip -q -o "$RUNNER_TEMP/uv.whl" -d "$RUNNER_TEMP/uvwheel"
          mkdir -p "$RUNNER_TEMP/uvbin"
          install -m 0755 "$RUNNER_TEMP/uvwheel/uv-0.8.17.data/scripts/uv" "$RUNNER_TEMP/uvbin/uv"
          "$RUNNER_TEMP/uvbin/uv" --version | grep -F "uv 0.8.17"
          echo "$RUNNER_TEMP/uvbin" >> "$GITHUB_PATH"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3

      - name: Emit curl plan (offline, validates the canonical plan)
        run: |
          uv run --no-sync python -m eth_research.data.acquire_runner emit \
            --plan "$PLAN_PATH" \
            --out "$RUNNER_TEMP/curlplan.json"

      - name: Fetch candles (public, unauthenticated GET only)
        env:
          ENDPOINT: https://api.exchange.coinbase.com/products/ETH-USD/candles
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/staging"
          mkdir -p "$STAGING"
          UA="$(jq -r '.user_agent' "$RUNNER_TEMP/curlplan.json")"
          COUNT="$(jq '.windows | length' "$RUNNER_TEMP/curlplan.json")"
          TOTAL=0
          for i in $(seq 0 $((COUNT - 1))); do
            ORD="$(jq -r ".windows[$i].ordinal" "$RUNNER_TEMP/curlplan.json")"
            START="$(jq -r ".windows[$i].requested_start" "$RUNNER_TEMP/curlplan.json")"
            END="$(jq -r ".windows[$i].requested_end" "$RUNNER_TEMP/curlplan.json")"
            FN="$(jq -r ".windows[$i].filename" "$RUNNER_TEMP/curlplan.json")"
            # Filenames are a strict charset in the plan; re-check defensively.
            case "$FN" in *[!A-Za-z0-9._-]*) echo "unsafe filename"; exit 1 ;; esac
            RETRIEVED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # curl -G with --data-urlencode: values are URL-encoded, never a
            # shell or URL-injection vector. Body to a file; only status/type
            # to stdout, so no response body is ever printed to the log.
            META="$(curl --silent --show-error --get "$ENDPOINT" \
              --data-urlencode "start=${START}" \
              --data-urlencode "end=${END}" \
              --data-urlencode "granularity=86400" \
              --header "User-Agent: ${UA}" \
              --header "Accept: application/json" \
              --connect-timeout 20 --max-time 60 \
              --max-filesize 5000000 --retry 0 \
              --output "$STAGING/$FN" \
              --write-out '%{http_code}\t%{content_type}')"
            CODE="$(printf '%s' "$META" | cut -f1)"
            CTYPE="$(printf '%s' "$META" | cut -f2)"
            if [ "$CODE" != "200" ]; then
              echo "window $ORD returned HTTP $CODE (no body logged)"; exit 1
            fi
            SIZE="$(wc -c < "$STAGING/$FN")"
            if [ "$SIZE" -gt 2000000 ]; then echo "window $ORD body too large"; exit 1; fi
            TOTAL=$((TOTAL + SIZE))
            if [ "$TOTAL" -gt 10485760 ]; then echo "aggregate byte cap exceeded"; exit 1; fi
            jq -cn \
              --argjson ordinal "$ORD" --arg filename "$FN" \
              --argjson http_code "$CODE" --arg retrieved_at "$RETRIEVED" \
              --arg content_type "$CTYPE" \
              '{ordinal:$ordinal,filename:$filename,http_code:$http_code,retrieved_at:$retrieved_at,content_type:$content_type}' \
              >> "$STAGING/_responses.jsonl"
            sleep 1
          done

      - name: Validate responses and write receipt (offline)
        id: publish
        run: |
          set -euo pipefail
          OUT="research/m2b/raw/coinbase/$AUDIT_ATTEMPT_ID"
          test ! -e "$OUT"
          mkdir -p "$OUT"
          uv run --no-sync python -m eth_research.data.acquire_runner verify \
            --plan "$PLAN_PATH" \
            --staging "$RUNNER_TEMP/staging" \
            --receipt-out "$OUT/acquisition_receipt.json" \
            --attempt-id "$AUDIT_ATTEMPT_ID" \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --curl-version "$(curl --version | head -1)" \
            --runner "github-actions ${{ runner.os }}-${{ runner.arch }}"
          for f in "$RUNNER_TEMP"/staging/*.json; do
            cp "$f" "$OUT/$(basename "$f")"
          done
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit the audit attempt (exact allowlist, fast-forward only)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.publish.outputs.out }}"
          STAGED="$(git diff --cached --name-only)"
          test -n "$STAGED"
          # Exact staged-path allowlist: only the new audit attempt's JSON.
          for p in $STAGED; do
            case "$p" in
              research/m2b/raw/coinbase/coinbase-eth-usd-audit-002/*.json) : ;;
              *) echo "unexpected staged path: $p"; exit 1 ;;
            esac
          done
          # The remote branch must still be exactly the triggering SHA.
          git fetch origin claude/m2b-real-data-benchmarks
          test "$(git rev-parse origin/claude/m2b-real-data-benchmarks)" = "${{ github.sha }}"
          git commit -m "chore(m2b): independent audit reacquisition coinbase-eth-usd-audit-002 (run ${{ github.run_id }}, plan @ ${{ github.sha }})"
          # No force: if the branch moved during the run, this push is
          # rejected and the job fails rather than overwriting anything.
          git push origin HEAD:claude/m2b-real-data-benchmarks
