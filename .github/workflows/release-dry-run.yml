name: Release Dry Run

# Publication-adjacent, read-only proof that the v1.1.0 distribution is buildable, private-data-safe,
# reproducible, and that the committed release evidence (manifest, SBOM, state) is current — without
# publishing anything. It uploads no artifact, references no secret, requests no OIDC token, and
# reaches no host but the pinned uv installer. This is the maximum release automation compatible with the
# repository's workflow-security invariant (tests/test_workflow_security.py); the actual PyPI
# Trusted-Publishing workflow is a documented template, not a live workflow (docs/V1_PUBLICATION_PIPELINE.md).

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GATE_LEDGER: research/m3a/development_gate_access.jsonl
  HOLDOUT_LEDGER: research/m2b/test_evaluations.jsonl
  PROSPECTIVE_LEDGER: research/m3d/prospective_evaluations.jsonl
  EMPTY_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: The three sealed ledgers are byte-empty
        run: |
          set -euo pipefail
          for L in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            test "$(sha256sum "$L" | cut -d' ' -f1)" = "$EMPTY_SHA"
          done
      - name: The committed release evidence is current (manifest, SBOM, state, neutrality)
        run: uv run --no-sync --python 3.12.3 python tools/release_evidence.py --check --repo-root .
      - name: Build the wheel + sdist twice (into separate directories)
        run: |
          uv build --out-dir dist_a
          uv build --out-dir dist_b
      - name: The distribution is private-data-safe (pure-Python allowlist scanner)
        run: uv run --no-sync --python 3.12.3 python tools/scan_distribution.py dist_a/*.whl dist_a/*.tar.gz
      - name: The double build is byte-identical (reproducible)
        run: |
          set -euo pipefail
          for f in dist_a/*; do
            base="$(basename "$f")"
            a="$(sha256sum "dist_a/$base" | cut -d' ' -f1)"
            b="$(sha256sum "dist_b/$base" | cut -d' ' -f1)"
            test "$a" = "$b" || { echo "$base not reproducible: $a != $b" >&2; exit 1; }
          done
      - name: Record the distribution checksums (informational; nothing is uploaded)
        run: |
          sha256sum dist_a/*.whl dist_a/*.tar.gz
      - name: Delete the local distribution (never upload or publish)
        run: rm -rf dist_a dist_b
