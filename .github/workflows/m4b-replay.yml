name: M4B Replay

# Fresh-clone reproducibility for the Milestone 4B multi-asset portfolio research simulator.
# The offline replay verifier regenerates the synthetic reference universe from code and proves
# the batch, streaming, and checkpoint/resume paths agree byte-for-byte, that the result artifact
# builds and verifies, and that the committed v1.1 public-API snapshot is current and additive over
# M4A's v1.0 snapshot. The single-asset compatibility oracle proves M4B reduces to the accepted
# fractional engine within the accepted binary64 ULP tolerance. Everything is offline and
# synthetic-only: no networking, no accepted real dataset, no tracked-file mutation. The three
# sealed access ledgers stay byte-empty throughout.

on:
  push:
    branches: ["**"]
    paths:
      - "src/eth_research/**"
      - "tests/test_portfolio_*.py"
      - "research/m4b/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/m4b-replay.yml"
  pull_request:

permissions:
  contents: read

env:
  GATE_LEDGER: research/m3a/development_gate_access.jsonl
  HOLDOUT_LEDGER: research/m2b/test_evaluations.jsonl
  PROSPECTIVE_LEDGER: research/m3d/prospective_evaluations.jsonl
  EMPTY_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

jobs:
  portfolio-replay:
    # Reproduce under the exact authoritative runtime (CPython 3.12.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: The portfolio test suite must run (cannot silently skip)
        run: |
          uv run --no-sync --python 3.12.3 python -m pytest -q -p no:cacheprovider \
            tests/test_portfolio_*.py
      - name: Offline replay verifier (determinism, streaming, resume, result, API)
        run: uv run --no-sync --python 3.12.3 python -m eth_research.portfolio.replay --check
      - name: The v1.1 public API snapshot is current and additive over v1.0
        run: uv run --no-sync --python 3.12.3 python -m eth_research.portfolio.public_api --check
      - name: The v1.1 registration artifacts are current (reference identity, manifest, freeze)
        run: uv run --no-sync --python 3.12.3 python -m eth_research.portfolio.registration --check
      - name: The offline CLI reference is current (pinned to CPython 3.12)
        run: uv run --no-sync --python 3.12.3 python -m eth_research.portfolio.cli_reference --check
      - name: All three sealed ledgers are byte-empty throughout
        run: |
          for ledger in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            if [ -s "$ledger" ]; then
              echo "sealed ledger $ledger is not empty" >&2
              exit 1
            fi
            got=$(sha256sum "$ledger" | cut -d' ' -f1)
            if [ "$got" != "$EMPTY_SHA" ]; then
              echo "sealed ledger $ledger changed (sha $got)" >&2
              exit 1
            fi
          done
          echo "all three sealed ledgers are byte-empty"
