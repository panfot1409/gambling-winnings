# Temporary, one-shot M3D prospective acquisition workflow.
#
# This is the ONLY workflow permitted `contents: write` or Coinbase network
# access, and only for the single `acquire` job. It is retired (deleted) once the
# primary and independent acquisitions are committed and verified (Milestone 3D
# section 25); after that no workflow contacts Coinbase or can write to the repo.
name: M3D Acquire

on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: "Prospective acquisition attempt id (must match a committed plan)"
        required: true
        type: choice
        options:
          - coinbase-eth-usd-prospective-genesis-001
          - coinbase-eth-usd-prospective-audit-002

permissions:
  contents: read

jobs:
  acquire:
    # Exact repository + stacked-branch guard: nothing else may run this.
    if: >-
      github.repository == 'panfot1409/gambling-winnings' &&
      github.ref == 'refs/heads/claude/m3d-prospective-evidence-governance'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/m3d-prospective-evidence-governance
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Record remote head before acquisition
        run: echo "REMOTE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: One-shot acquisition (offline-validated; body hashes only)
        env:
          ATTEMPT_ID: ${{ github.event.inputs.attempt_id }}
        run: |
          set -euo pipefail
          RAW_DIR="research/m3d/raw/coinbase/${ATTEMPT_ID}"
          PLAN="${RAW_DIR}/acquisition_plan.json"
          test -f "$PLAN"
          CLIENT="python-urllib/$(python3 -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')"
          uv run --no-sync python -m eth_research.m3d.acquire_runner \
            --plan "$PLAN" \
            --raw-dir "$RAW_DIR" \
            --source-commit "$(git rev-parse HEAD)" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --runner-identity "$(uname -srm)" \
            --client-identity "$CLIENT" \
            --receipt-out "${RAW_DIR}/acquisition_receipt.json"
      - name: Verify bot-commit scope, remote head, and fast-forward push
        env:
          ATTEMPT_ID: ${{ github.event.inputs.attempt_id }}
        run: |
          set -euo pipefail
          RAW_DIR="research/m3d/raw/coinbase/${ATTEMPT_ID}"
          # Only the allowlisted raw directory may have changed.
          if git status --porcelain | grep -vE "(^|[?M ]) *${RAW_DIR}/" ; then
            echo "refusing: changes outside ${RAW_DIR}"
            exit 1
          fi
          # Refuse if the remote branch head moved since checkout.
          git fetch origin claude/m3d-prospective-evidence-governance
          REMOTE_NOW="$(git rev-parse origin/claude/m3d-prospective-evidence-governance)"
          if [ "$REMOTE_NOW" != "$REMOTE_HEAD" ]; then
            echo "refusing: remote head moved from $REMOTE_HEAD to $REMOTE_NOW"
            exit 1
          fi
          git config user.name "m3d-acquire-bot"
          git config user.email "m3d-acquire-bot@users.noreply.github.com"
          git add "${RAW_DIR}"
          git commit -m "M3D: bot prospective acquisition ${ATTEMPT_ID} (raw bytes + receipt)"
          # Fast-forward only; never a force push.
          git push origin HEAD:claude/m3d-prospective-evidence-governance
