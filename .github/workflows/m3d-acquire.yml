# Temporary, one-shot M3D prospective acquisition workflow.
#
# This is the ONLY workflow permitted `contents: write` or Coinbase network
# access, and only for the single `acquire` job. The network boundary is a
# hardened `curl` step (TLS-only, no cross-host redirect, fail-on-error, bounded
# body size); the Python runner never opens a socket — it emits the request
# parameters and then validates the downloaded bodies strictly offline. The
# workflow is retired (deleted) once the primary and independent acquisitions are
# committed and verified (Milestone 3D section 25).
#
# Trigger surface: because this workflow file lives only on the stacked feature
# branch (never on the default branch), `workflow_dispatch` is not dispatchable
# here; the operative trigger is a `push` that modifies the single committed
# sentinel `research/m3d/acquire.trigger`, exactly as the reviewed M2B
# acquisition bootstrap worked. Both triggers resolve the same strictly
# whitelisted attempt id.
name: M3D Acquire

on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: "Prospective acquisition attempt id (must match a committed plan)"
        required: true
        type: choice
        options:
          - coinbase-eth-usd-prospective-genesis-001
          - coinbase-eth-usd-prospective-audit-002
  push:
    branches: ["claude/m3d-prospective-evidence-governance"]
    paths:
      - "research/m3d/acquire.trigger"

permissions:
  contents: read

concurrency:
  group: m3d-acquire
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.repository == 'panfot1409/gambling-winnings' &&
      github.ref == 'refs/heads/claude/m3d-prospective-evidence-governance'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: claude/m3d-prospective-evidence-governance
      - name: Resolve the attempt id (dispatch input or committed trigger)
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ATTEMPT_ID='${{ github.event.inputs.attempt_id }}'
          else
            test -f research/m3d/acquire.trigger
            ATTEMPT_ID="$(jq -r '.attempt_id' research/m3d/acquire.trigger)"
          fi
          case "$ATTEMPT_ID" in
            coinbase-eth-usd-prospective-genesis-001) ;;
            coinbase-eth-usd-prospective-audit-002) ;;
            *) echo "refusing: unexpected attempt id '$ATTEMPT_ID'"; exit 1 ;;
          esac
          echo "attempt_id=$ATTEMPT_ID" >> "$GITHUB_OUTPUT"
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: Record remote head before acquisition
        run: echo "REMOTE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Emit the offline-computed curl request plan
        env:
          ATTEMPT_ID: ${{ steps.params.outputs.attempt_id }}
        run: |
          set -euo pipefail
          RAW_DIR="research/m3d/raw/coinbase/${ATTEMPT_ID}"
          test -f "${RAW_DIR}/acquisition_plan.json"
          uv run --no-sync python -m eth_research.m3d.acquire_runner emit-plan \
            --plan "${RAW_DIR}/acquisition_plan.json" \
            --out "${RAW_DIR}/_curl_plan.json"
      - name: Fetch each window with hardened curl (TLS, no redirect, size cap)
        env:
          ATTEMPT_ID: ${{ steps.params.outputs.attempt_id }}
        run: |
          set -euo pipefail
          RAW_DIR="research/m3d/raw/coinbase/${ATTEMPT_ID}"
          PLAN="${RAW_DIR}/_curl_plan.json"
          UA="$(jq -r .user_agent "$PLAN")"
          ENDPOINT="$(jq -r .endpoint "$PLAN")"
          GRAN="$(jq -r .granularity_seconds "$PLAN")"
          : > "${RAW_DIR}/_responses.jsonl"
          COUNT="$(jq '.windows | length' "$PLAN")"
          for i in $(seq 0 $((COUNT - 1))); do
            ORD="$(jq -r ".windows[$i].ordinal" "$PLAN")"
            START="$(jq -r ".windows[$i].start_param" "$PLAN")"
            END="$(jq -r ".windows[$i].end_param" "$PLAN")"
            FN="$(jq -r ".windows[$i].filename" "$PLAN")"
            URL="${ENDPOINT}?start=${START}&end=${END}&granularity=${GRAN}"
            META="$(curl -sS --proto '=https' --tlsv1.2 --max-redirs 0 --fail \
              --max-filesize 2097152 -H "User-Agent: ${UA}" \
              -w '%{http_code}\t%{content_type}' \
              -o "${RAW_DIR}/${FN}" "$URL")"
            CODE="$(printf '%s' "$META" | cut -f1)"
            CT="$(printf '%s' "$META" | cut -f2)"
            NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '{"content_type":"%s","filename":"%s","http_code":%s,"ordinal":%s,"retrieved_at":"%s"}\n' \
              "$CT" "$FN" "$CODE" "$ORD" "$NOW" >> "${RAW_DIR}/_responses.jsonl"
          done
      - name: Validate every response offline and write the receipt
        env:
          ATTEMPT_ID: ${{ steps.params.outputs.attempt_id }}
        run: |
          set -euo pipefail
          RAW_DIR="research/m3d/raw/coinbase/${ATTEMPT_ID}"
          RAW_CLIENT_BANNER="$(curl --version)"
          CLIENT_TOKEN="$(printf '%s' "$RAW_CLIENT_BANNER" | head -1 | awk '{print $1"/"$2}')"
          uv run --no-sync python -m eth_research.m3d.acquire_runner verify \
            --plan "${RAW_DIR}/acquisition_plan.json" \
            --staging "${RAW_DIR}" \
            --receipt-out "${RAW_DIR}/acquisition_receipt.json" \
            --attempt-id "${ATTEMPT_ID}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --source-commit "$(git rev-parse HEAD)" \
            --client-identity "${CLIENT_TOKEN}" \
            --runner-identity "$(uname -srm)" \
            --created-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Staging-only files are never committed.
          rm -f "${RAW_DIR}/_curl_plan.json" "${RAW_DIR}/_responses.jsonl"
      - name: Verify bot-commit scope, remote head, and fast-forward push
        env:
          ATTEMPT_ID: ${{ steps.params.outputs.attempt_id }}
        run: |
          set -euo pipefail
          RAW_DIR="research/m3d/raw/coinbase/${ATTEMPT_ID}"
          if git status --porcelain | grep -vE "(^|[?M ]) *${RAW_DIR}/" ; then
            echo "refusing: changes outside ${RAW_DIR}"
            exit 1
          fi
          git fetch origin claude/m3d-prospective-evidence-governance
          REMOTE_NOW="$(git rev-parse origin/claude/m3d-prospective-evidence-governance)"
          if [ "$REMOTE_NOW" != "$REMOTE_HEAD" ]; then
            echo "refusing: remote head moved from $REMOTE_HEAD to $REMOTE_NOW"
            exit 1
          fi
          git config user.name "m3d-acquire-bot"
          git config user.email "m3d-acquire-bot@users.noreply.github.com"
          git add "${RAW_DIR}"
          git commit -m "M3D: bot prospective acquisition ${ATTEMPT_ID} (raw bytes + receipt)"
          git push origin HEAD:claude/m3d-prospective-evidence-governance
