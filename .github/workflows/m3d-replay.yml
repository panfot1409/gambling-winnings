name: M3D Replay

# Fresh-clone reproducibility for the Milestone 3D prospective evidence facility.
# Every artifact is re-derived from the committed raw Coinbase bytes alone and the
# whole-program graph verifier runs its complete chain. Because M3D evaluates
# nothing, there is no numerical tolerance: the canonical content is byte-exact on
# every supported interpreter. No networking, no engine call, no tracked-file
# mutation. The two sealed access ledgers (development gate, final holdout) and the
# prospective evaluation ledger must stay byte-empty before and after replay.

on:
  push:
    branches: ["**"]
    paths:
      - "research/m3d/**"
      - "research/m2b/**"
      - "research/m3a/**"
      - "research/m3b/**"
      - "research/m3c/**"
      - "src/eth_research/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/m3d-replay.yml"
  pull_request:

permissions:
  contents: read

env:
  GATE_LEDGER: research/m3a/development_gate_access.jsonl
  HOLDOUT_LEDGER: research/m2b/test_evaluations.jsonl
  PROSPECTIVE_LEDGER: research/m3d/prospective_evaluations.jsonl
  EMPTY_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

jobs:
  authoritative-replay:
    # Reproduce under the exact authoritative runtime (CPython 3.12.3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Install the authoritative CPython 3.12.3
        run: uv python install 3.12.3
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3
      - name: M3D firewall + graph-verifier tests must run (cannot silently skip)
        run: uv run --no-sync --python 3.12.3 python -m pytest tests/test_m3d_firewall.py -q -p no:cacheprovider
      - name: All three ledgers are byte-empty before
        run: |
          set -euo pipefail
          for L in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            test "$(sha256sum "$L" | cut -d' ' -f1)" = "$EMPTY_SHA"
          done
      - name: Offline deep replay (rebuild everything byte-exact; full graph verify)
        run: uv run --no-sync --python 3.12.3 python -m eth_research.m3d.replay --repo-root . --deep
      - name: Data-only status emits no evaluation values
        run: uv run --no-sync --python 3.12.3 python -m eth_research.m3d.status --repo-root .
      - name: Replay mutated no tracked file
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: All three ledgers are byte-empty after
        run: |
          set -euo pipefail
          for L in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            test "$(sha256sum "$L" | cut -d' ' -f1)" = "$EMPTY_SHA"
          done

  compat-replay:
    # The rebuild is interpreter-independent: the canonical content and every
    # committed artifact reproduce byte-for-byte on each supported interpreter.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv 0.8.17 (hash-pinned PyPI wheel)
        run: |
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/python" -m pip install --require-hashes --only-binary=:all: -r ci/uv-requirements.txt
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --locked --all-extras --python ${{ matrix.python-version }}
      - name: M3D firewall + graph-verifier tests must run (cannot silently skip)
        run: uv run --no-sync python -m pytest tests/test_m3d_firewall.py -q -p no:cacheprovider
      - name: All three ledgers are byte-empty before
        run: |
          set -euo pipefail
          for L in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            test "$(sha256sum "$L" | cut -d' ' -f1)" = "$EMPTY_SHA"
          done
      - name: Offline deep replay (rebuild everything byte-exact; full graph verify)
        run: uv run --no-sync python -m eth_research.m3d.replay --repo-root . --deep
      - name: Replay mutated no tracked file
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: All three ledgers are byte-empty after
        run: |
          set -euo pipefail
          for L in "$GATE_LEDGER" "$HOLDOUT_LEDGER" "$PROSPECTIVE_LEDGER"; do
            test "$(sha256sum "$L" | cut -d' ' -f1)" = "$EMPTY_SHA"
          done
