name: M2B Acquire

# One-shot, tightly scoped clean-room acquisition of public Coinbase Exchange
# ETH-USD daily candles. Unauthenticated GET only, to one fixed endpoint,
# driven entirely by a committed, validated request plan. No secret, key,
# account, wallet, order, or private endpoint is ever used. All parsing and
# validation stay in the offline package; the only network call is curl.

on:
  workflow_dispatch:
    inputs:
      plan_path:
        description: "Committed request plan to fulfil"
        required: true
        default: "research/m2b/discovery_plan.json"
      attempt_id:
        description: "Distinct attempt identifier ([A-Za-z0-9._-])"
        required: true
        default: "discovery-001"
  push:
    branches: ["claude/m2b-real-data-benchmarks"]
    paths:
      - "research/m2b/acquire.trigger"

# Default read-only; the acquire job elevates to contents:write only to
# publish the raw bytes it verified.
permissions:
  contents: read

concurrency:
  group: m2b-acquire
  cancel-in-progress: false

jobs:
  acquire:
    # Never on a fork, never off this repo/branch.
    if: >-
      github.repository == 'panfot1409/gambling-winnings' &&
      github.ref == 'refs/heads/claude/m2b-real-data-benchmarks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: claude/m2b-real-data-benchmarks
          persist-credentials: true

      - name: Resolve acquisition parameters
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PLAN_PATH='${{ github.event.inputs.plan_path }}'
            ATTEMPT_ID='${{ github.event.inputs.attempt_id }}'
          else
            test -f research/m2b/acquire.trigger
            PLAN_PATH="$(jq -r '.plan_path' research/m2b/acquire.trigger)"
            ATTEMPT_ID="$(jq -r '.attempt_id' research/m2b/acquire.trigger)"
          fi
          # Defensive shape checks: no traversal or injection can reach a shell.
          case "$ATTEMPT_ID" in
            "" | *[!A-Za-z0-9._-]*) echo "invalid attempt id"; exit 1 ;;
          esac
          case "$PLAN_PATH" in
            research/m2b/*.json) : ;;
            *) echo "plan path must be a research/m2b/*.json file"; exit 1 ;;
          esac
          case "$PLAN_PATH" in
            *..*) echo "plan path must not contain .."; exit 1 ;;
          esac
          test -f "$PLAN_PATH"
          {
            echo "plan_path=$PLAN_PATH"
            echo "attempt_id=$ATTEMPT_ID"
            echo "head_before=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv 0.8.17 (pinned)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --all-extras --python 3.12.3

      - name: Emit curl plan (offline, validates the request plan)
        run: |
          uv run --no-sync python -m eth_research.data.acquire_runner emit \
            --plan "${{ steps.params.outputs.plan_path }}" \
            --out "$RUNNER_TEMP/curlplan.json"

      - name: Fetch candles (public, unauthenticated GET only)
        env:
          ENDPOINT: https://api.exchange.coinbase.com/products/ETH-USD/candles
        run: |
          set -euo pipefail
          STAGING="$RUNNER_TEMP/staging"
          mkdir -p "$STAGING"
          UA="$(jq -r '.user_agent' "$RUNNER_TEMP/curlplan.json")"
          COUNT="$(jq '.windows | length' "$RUNNER_TEMP/curlplan.json")"
          for i in $(seq 0 $((COUNT - 1))); do
            ORD="$(jq -r ".windows[$i].ordinal" "$RUNNER_TEMP/curlplan.json")"
            START="$(jq -r ".windows[$i].requested_start" "$RUNNER_TEMP/curlplan.json")"
            END="$(jq -r ".windows[$i].requested_end" "$RUNNER_TEMP/curlplan.json")"
            FN="$(jq -r ".windows[$i].filename" "$RUNNER_TEMP/curlplan.json")"
            # Filenames are a strict charset in the plan; re-check defensively.
            case "$FN" in *[!A-Za-z0-9._-]*) echo "unsafe filename"; exit 1 ;; esac
            RETRIEVED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # curl -G with --data-urlencode: values are URL-encoded, never a
            # shell or URL-injection vector. Body to a file; only status/type
            # to stdout, so no response body is ever printed to the log.
            META="$(curl --silent --show-error --get "$ENDPOINT" \
              --data-urlencode "start=${START}" \
              --data-urlencode "end=${END}" \
              --data-urlencode "granularity=86400" \
              --header "User-Agent: ${UA}" \
              --header "Accept: application/json" \
              --connect-timeout 20 --max-time 60 \
              --max-filesize 5000000 --retry 0 \
              --output "$STAGING/$FN" \
              --write-out '%{http_code}\t%{content_type}')"
            CODE="$(printf '%s' "$META" | cut -f1)"
            CTYPE="$(printf '%s' "$META" | cut -f2)"
            if [ "$CODE" != "200" ]; then
              echo "window $ORD returned HTTP $CODE (no body logged)"; exit 1
            fi
            SIZE="$(wc -c < "$STAGING/$FN")"
            if [ "$SIZE" -gt 2000000 ]; then echo "window $ORD body too large"; exit 1; fi
            jq -cn \
              --argjson ordinal "$ORD" --arg filename "$FN" \
              --argjson http_code "$CODE" --arg retrieved_at "$RETRIEVED" \
              --arg content_type "$CTYPE" \
              '{ordinal:$ordinal,filename:$filename,http_code:$http_code,retrieved_at:$retrieved_at,content_type:$content_type}' \
              >> "$STAGING/_responses.jsonl"
            sleep 1
          done

      - name: Validate responses and write receipt (offline)
        id: publish
        run: |
          set -euo pipefail
          OUT="research/m2b/raw/coinbase/${{ steps.params.outputs.attempt_id }}"
          mkdir -p "$OUT"
          uv run --no-sync python -m eth_research.data.acquire_runner verify \
            --plan "${{ steps.params.outputs.plan_path }}" \
            --staging "$RUNNER_TEMP/staging" \
            --receipt-out "$OUT/acquisition_receipt.json" \
            --attempt-id "${{ steps.params.outputs.attempt_id }}" \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --curl-version "$(curl --version | head -1)" \
            --runner "github-actions ${{ runner.os }}-${{ runner.arch }}"
          for f in "$RUNNER_TEMP"/staging/*.json; do
            bn="$(basename "$f")"
            cp "$f" "$OUT/$bn"
          done
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit verified raw data (bot, fast-forward only)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.publish.outputs.out }}"
          if git diff --cached --quiet; then
            echo "no raw changes to commit"; exit 0
          fi
          git commit -m "chore(m2b): raw Coinbase acquisition ${{ steps.params.outputs.attempt_id }} (run ${{ github.run_id }}, plan @ ${{ github.sha }})"
          # No force: if the branch moved during the run, this push is rejected
          # and the job fails rather than overwriting.
          git push origin HEAD:claude/m2b-real-data-benchmarks
